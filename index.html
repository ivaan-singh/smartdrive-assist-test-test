<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartDrive Assist</title>
<script>
  var path = window.location.pathname;
  var base = path.endsWith('/') ? path : path.replace(/[^/]*$/, '');
  window.location.replace(base + 'landing-page/');
</script>
</head>

</html>
